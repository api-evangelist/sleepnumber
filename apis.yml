name: Sleep Number
description: 'Sleep Number Corporation (NASDAQ: SNBR) designs, manufactures, and retails
  smart adjustable-firmness beds and sleep-wellness products, sold through an omnichannel
  US retail model. Its Sleep Number 360 smart beds run the proprietary SleepIQ operating
  system, which captures biometric sleep data each night and returns actionable insights
  to improve sleep health. Sleep Number does not publish a public developer API or
  developer portal; the SleepIQ platform is a closed, undocumented backend consumed
  only by the first-party mobile and web apps. The community has reverse-engineered
  unofficial SleepIQ client libraries (Python, Go, PHP), but these are not first-party
  and are not endorsed by Sleep Number. This profile was surfaced as a legacy portfolio
  lead of Norwest Venture Partners and enriched by the API Evangelist pipeline.'
